[package]
name = "ai-council"
version = "1.0.0"
edition = "2021"

[lib]
name = "ai_council_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "http2"] }
futures-util = "0.3"
url = "2"
tokio = { version = "1", features = ["macros", "sync"] }
tauri-plugin-dialog = "2"
ignore = "0.4"
tauri-plugin-opener = "2"
# Read-only git in-process: the App Store sandbox cannot run /usr/bin/git.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Security-scoped bookmarks, so picked folders stay readable after relaunch in the sandbox.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSError", "NSString", "NSArray"] }
