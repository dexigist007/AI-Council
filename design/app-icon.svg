<!-- Conclave app icon (1024x1024, macOS safe area: 824px rounded square).
     A hemicycle of seats facing one point: the council debates, the decision is yours.
     Regenerate the icon set with: npx tauri icon design/app-icon.png -o src-tauri/icons -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22897a"/>
      <stop offset="1" stop-color="#11493f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e3a72f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  </g>
  <!-- the chamber -->
  <path d="M 274.2 572.7 A 250 250 0 0 1 749.8 572.7" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="16" stroke-linecap="round"/>
  <!-- five seats -->
  <circle cx="274.2" cy="572.7" r="52" fill="#ffffff"/>
  <circle cx="365.1" cy="447.7" r="52" fill="#ffffff"/>
  <circle cx="512.0" cy="400.0" r="52" fill="#ffffff"/>
  <circle cx="658.9" cy="447.7" r="52" fill="#ffffff"/>
  <circle cx="749.8" cy="572.7" r="52" fill="#ffffff"/>
  <!-- the decision -->
  <circle cx="512" cy="650" r="74" fill="#f5c451" opacity="0.45" filter="url(#glow)"/>
  <circle cx="512" cy="650" r="68" fill="url(#gold)"/>
</svg>
