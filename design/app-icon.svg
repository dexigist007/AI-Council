<!-- App icon source (1024x1024, macOS safe area: 824px rounded square). Regenerate icons with:
     npx tauri icon design/app-icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27907f"/>
      <stop offset="1" stop-color="#14594f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  </g>
  <!-- the table -->
  <circle cx="512" cy="540" r="142" fill="none" stroke="#ffffff" stroke-width="40"/>
  <!-- three seats -->
  <circle cx="512" cy="282" r="64" fill="#ffffff"/>
  <circle cx="735" cy="671" r="64" fill="#ffffff" fill-opacity="0.82"/>
  <circle cx="289" cy="671" r="64" fill="#ffffff" fill-opacity="0.64"/>
</svg>
